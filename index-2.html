<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma carte</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:Arial,Helvetica,sans-serif; background:#f4eaff; color:#24152f;
      padding:18px;
    }
    .card{
      width:min(430px,100%); background:#fff; border-radius:24px; overflow:hidden;
      box-shadow:0 15px 45px rgba(55,25,75,.22);
    }
    .photo-wrap{position:relative; height:540px; background:#ddd; overflow:hidden}
    .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.42))}
    .badge{
      position:absolute;left:18px;bottom:22px;background:#c64de0;color:#fff;
      padding:13px 20px;border-radius:30px;font-size:20px;font-weight:700;
    }
    .content{padding:24px;text-align:center}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:8px 0 18px;color:#6b5b72}
    .amount{
      font-size:42px;font-weight:800;margin:15px 0;color:#a62cc3;
    }
    button{
      width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:17px;
      font-weight:700;background:#c64de0;color:white;cursor:pointer;
    }
    button:active{transform:scale(.98)}
    .note{font-size:13px;margin-top:12px;color:#8a7c91}
  </style>
</head>
<body>
  <main class="card">
    <div class="photo-wrap">
      <img src="photo.jpg" alt="Photo de la carte">
      <div class="shade"></div>
      <div class="badge">Une petite surprise 💜</div>
    </div>

    <section class="content">
      <h1>Bonjour ! 👋</h1>
      <p>Voici ta carte en français.</p>
      <div class="amount">50 €</div>
      <button onclick="alert('Merci ! 💜')">Continuer</button>
      <div class="note">Montant affiché en euros (€).</div>
    </section>
  </main>
</body>
</html>
